name: XRobot Module Build Test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 1 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xrobot-org/docker-image-webots:main
      options: --user 0

    env:
      XR_MODULE_NAME: ${{ github.event.repository.name }}
      XR_MODULE_REF: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout current module repo to ./Modules/${{ env.XR_MODULE_NAME }}
        uses: actions/checkout@v4
        with:
          path: Modules/${{ env.XR_MODULE_NAME }}

      - name: Create main.cpp
        run: |
          cat > main.cpp <<'EOF'
          #include <iostream>
          #include "xrobot_main.hpp"
          #include "libxr.hpp"

          int main() {
              LibXR::PlatformInit();
              LibXR::STDIO::Printf<"This is XRobot Module Template Test\n">();
              LibXR::HardwareContainer hw;
              XRobotMain(hw);
              return 0;
          }
          EOF

      - name: Create minimal CMakeLists.txt
        run: |
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.10)
          project(xrobot_mod_test CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          add_executable(xr_test main.cpp)
          set(XROBOT_MODULES_DIR ${CMAKE_CURRENT_SOURCE_DIR}/Modules/)
          set(WEBOTS_HOME /usr/local/webots)
          add_subdirectory(libxr)
          set_property(TARGET xr PROPERTY CXX_STANDARD 20)
          set_property(TARGET xr PROPERTY CXX_STANDARD_REQUIRED ON)
          target_include_directories(xr_test PUBLIC $<TARGET_PROPERTY:xr,INTERFACE_INCLUDE_DIRECTORIES> ${CMAKE_SOURCE_DIR}/User)
          target_link_libraries(xr_test PUBLIC xr)
          EOF

      - name: Pull libxr to ./libxr
        run: git clone --depth=1 https://github.com/Jiu-xiao/libxr ./libxr

      - name: Setup Python & Install deps
        run: |
          apt-get update
          apt-get install -y libgpiod-dev
          python3 -m pip install --upgrade pip
          pip3 install pyyaml requests

      - name: Add XRobot tools to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install xrobot toolchain
        run: |
          pip3 install xrobot libxr

      - name: Sync dependency repos
        run: |
          git clone --depth=1 --branch master https://github.com/QDU-Robomaster/CameraBase.git Modules/CameraBase
          git clone --depth=1 --branch master https://github.com/QDU-Robomaster/CameraSync.git Modules/CameraSync
          git clone --depth=1 --branch master https://github.com/QDU-Robomaster/WebotsCamera.git Modules/WebotsCamera
          git clone --depth=1 --branch master https://github.com/QDU-Robomaster/CameraFrameSync.git Modules/CameraFrameSync
          git clone --depth=1 --branch master https://github.com/QDU-Robomaster/VisionPreview.git Modules/VisionPreview
          git clone --depth=1 --branch master https://github.com/QDU-Robomaster/ArmorDetector.git Modules/ArmorDetector
          git clone --depth=1 --branch master https://github.com/QDU-Robomaster/ArmorTracker.git Modules/ArmorTracker

      - name: Create test module config
        run: |
          mkdir -p User
          cat > aimer_ci.yaml <<'EOF'
          global_settings:
            monitor_sleep_ms: 1000

          modules:
            - id: Aimer_0
              name: Aimer
              constructor_args:
                cfg:
                  yaw_offset: -1.0
                  pitch_offset: -1.4
                  yaw_rate_threshold: 2.0
                  default_bullet_speed: 23.0
                  min_valid_bullet_speed: 14.0
                  auto_fire: true
                  image_to_now_s: 0.0
                  vision_to_command_delay_s: 0.0
                  command_transport_delay_s: 0.0
                  gimbal_response_delay_s: 0.0
                  fire_delay_s: 0.0
                  low_speed_extra_predict_s: 0.015
                  high_speed_extra_predict_s: 0.03
                  armor_width_m: 0.135
                  armor_height_m: 0.055
                  bullet_spread_m: 0.015
                  min_fire_threshold: 0.003
                  max_fire_threshold: 0.05
                  enable_pitch_fire_gate: false
                  enable_mpc_plan: true
                  mpc_fire_thresh: 0.05
                  max_yaw_acc: 100.0
                  q_yaw_pos: 50.0
                  q_yaw_vel: 1.0
                  r_yaw_acc: 1.0
                  max_pitch_acc: 100.0
                  q_pitch_pos: 50.0
                  q_pitch_vel: 1.0
                  r_pitch_acc: 1.0
                  mpc_max_iter: 10
          EOF
          cat aimer_ci.yaml

      - name: Generate main
        run: |
          xrobot_gen_main --config aimer_ci.yaml --output User/xrobot_main.hpp

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DOpenVINO_DIR=/opt/intel/openvino_2025.4.0/runtime/cmake \
            -DLIBXR_PRINT_INTEGER_ENABLE_64BIT=ON \
            -DLIBXR_PRINT_FLOAT_ENABLE_DOUBLE=ON \
            -DLIBXR_PRINT_ENABLE_POINTER=ON
          make

      - name: Create Tag via GitHub API
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagPrefix = 'auto-'
            const date = new Date();
            const yyyy = date.getUTCFullYear();
            const mm = String(date.getUTCMonth() + 1).padStart(2, '0');
            const dd = String(date.getUTCDate()).padStart(2, '0');
            const HH = String(date.getUTCHours()).padStart(2, '0');
            const MM = String(date.getUTCMinutes()).padStart(2, '0');
            const SS = String(date.getUTCSeconds()).padStart(2, '0');
            const tagName = `${tagPrefix}${yyyy}${mm}${dd}-${HH}${MM}${SS}`;

            const sha = process.env.GITHUB_SHA;

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tagName}`,
              sha: sha
            });
            console.log(`Created tag: ${tagName} on sha: ${sha}`);
